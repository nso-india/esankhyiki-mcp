name: AI PR Review

# Single-pass AI review focused on code quality.
#
# Structural consistency (dataset count drift, missing wiring, broken
# swagger registration, etc.) is verified deterministically by
# tests/test_consistency.py — the LLM is told NOT to duplicate those
# checks. This keeps the LLM scoped to where it adds real value (code
# smells, edge cases, security, naming) and away from where it
# hallucinates (line numbers, structural claims).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather diff
        id: context
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=50 origin "$BASE_REF"
          TMPDIFF=$(mktemp)
          trap "rm -f $TMPDIFF" EXIT
          git diff "origin/${BASE_REF}...${HEAD_SHA}" > "$TMPDIFF"
          # gpt-4o allows 8000 input tokens. Reserve ~1500 for system prompt
          # and metadata, leaving ~6500 for the diff. ~26KB at 4 chars/token.
          DIFF=$(head -c 25000 "$TMPDIFF")
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}")
          {
            echo "diff<<DIFFEOF"
            echo "$DIFF"
            echo "DIFFEOF"
            echo "changed<<CHGEOF"
            echo "$CHANGED"
            echo "CHGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run AI review
        id: ai
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4o
          max-completion-tokens: 1500
          system-prompt: |
            You are reviewing a pull request on the MoSPI MCP server: a
            FastMCP 3.0 server exposing 23+ Indian govt statistical
            datasets over the Model Context Protocol. Single-file server
            design (mospi_server.py); swagger YAMLs are the source of
            truth for parameter validation.

            ## What is ALREADY verified deterministically (DO NOT duplicate)

            tests/test_consistency.py mechanically checks all of:
            - VALID_DATASETS, DATASET_SWAGGER, EXPECTED_DATASETS agree
            - total_datasets count is correct
            - Startup banner count and dataset names match
            - README feature count and dataset table rows match
            - CONTRIBUTING.md dataset count lines match
            - Every dataset has a swagger_user_<name>.yaml file
            - indicator_methods dict has every dataset
            - dataset_map in get_data covers every dataset

            If any of those drift, CI fails. You will see the failure
            without needing to flag it. Do NOT mention these in your
            review.

            ## Your scope — focus only on these

            1. **Code quality**: naming, structure, dead code, obvious
               bugs in NEW code visible in the diff.
            2. **Edge cases**: what inputs would break the new logic?
            3. **Security**: secrets in code, injection vectors, unsafe
               deserialization, overly permissive nginx/CSP changes.
            4. **Documentation drift IN DOCSTRINGS** (not in counts —
               those are tested).
            5. **Test quality**: does a new test actually exercise what
               it claims?

            ## Project conventions (flag only when violated in the diff)

            - Param renames in get_data: RBI uses sub_indicator_code;
              MNRE uses type_of_renewable_energy_code; NSS80 derives
              survey_code (1-20=CMST, 23-42=CMSE).
            - FastMCP doesn't enforce type hints; numeric params go
              through _safe_int().
            - Don't replace LegacyRenegotiationAdapter (MoSPI needs
              legacy TLS).
            - --stateless in Dockerfile CMD is required for ChatGPT.

            ## CRITICAL — anti-hallucination rules

            - **Quote the exact text from the diff** you are flagging.
              If you can't quote it, don't flag it.
            - Don't reference line numbers that don't appear in the
              diff. The diff hunks (@@ -X,Y +A,B @@) tell you the line
              numbers; use those, not made-up ones.
            - Don't claim items are "missing" — focus on what IS
              visible in the diff.
            - When unsure, prefer SUGGESTION over BLOCKING. Save
              BLOCKING for clear, evidenced bugs.

            ## Don't flag

            - Dataset count / wiring / swagger registration — tested
              automatically.
            - Linter-style formatting.
            - Splitting mospi_server.py (single-file is intentional).
            - Adding type-hint enforcement.
            - Removing 'unsafe-inline' from CSP (accepted in May 2026
              KPMG VA).
            - PR description vs implementation inconsistencies (PR
              hygiene, not code).

            ## Output (Markdown)

            ## Summary
            One sentence: what the PR does + overall verdict.

            ## Findings
            For each issue:
            - **[BLOCKING/SUGGESTION/NIT]** `path:line` — issue
              (quote the relevant line(s) from the diff). Why it
              matters (1 sentence). Suggested fix (1 line).

            ## Verdict
            - Blocking: N
            - Suggestion: N
            - Nit: N
            - Recommendation: Approve / Request Changes / Comment
            - One-sentence rationale.

            If you find nothing, write:

            ## Findings
            _None._

            ## Verdict
            - Blocking: 0
            - Suggestion: 0
            - Nit: 0
            - Recommendation: Approve
            - The change is clean and follows project conventions.
          prompt: |
            PR title: ${{ github.event.pull_request.title }}

            PR description:
            ${{ github.event.pull_request.body }}

            Changed files:
            ${{ steps.context.outputs.changed }}

            Diff (may be truncated; if so, judge only what you can see):
            ```diff
            ${{ steps.context.outputs.diff }}
            ```

      - name: Post or update review comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai.outputs.response }}
        with:
          script: |
            const marker = '<!-- ai-pr-review -->';
            const body = `${marker}\n## 🤖 AI PR Review\n\n${process.env.REVIEW}\n\n---\n_Auto-generated. Structural checks (dataset count, wiring) are handled deterministically by [\`tests/test_consistency.py\`](../blob/main/tests/test_consistency.py); this review focuses on code quality. Model: \`openai/gpt-4o\` via [GitHub Models](https://docs.github.com/en/github-models). Workflow: \`.github/workflows/ai-review.yml\`. Add the \`skip-review\` label to suppress._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
